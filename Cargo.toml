[workspace]
members = ["crates/haven-core", "crates/haven-highlight", "crates/haven-macos", "crates/haven"]
resolver = "2"
# Vendored third-party code: not linted or tested as part of Haven.
exclude = ["vendor/gpui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit", "runtime_shaders"] }
ignore = "0.4"
jwalk = "0.8"
libc = "0.2"
notify = "7"
nucleo = "0.5"
plist = "1.7"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smol = "2"
tempfile = "3"
xattr = "1.3"
regex = "1"
haven-core = { path = "crates/haven-core" }
haven-highlight = { path = "crates/haven-highlight" }
haven-macos = { path = "crates/haven-macos" }

# Haven patches gpui's macOS glyph rasterizer (font smoothing); see
# vendor/gpui/HAVEN_PATCHES.md.
[patch.crates-io]
gpui = { path = "vendor/gpui" }

[profile.release]
lto = "thin"
codegen-units = 4
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
